<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Microgate Informática</title>
    <link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">


    <link rel="stylesheet" href="./css/output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/components.js" defer></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease;
        }
    </style>
</head>

<body class="bg-brand-dark text-brand-light text-brand-dark dark:text-brand-light">
    <div class="boxed-layout">
        <div class="content-wrapper min-h-screen">
            <div id="header-placeholder"></div>

            <main class="pt-32 pb-20 px-4">
                <div class="max-w-7xl mx-auto">
                    <div class="text-center mb-16">
                        <h1 class="text-4xl md:text-6xl font-black italic tracking-tight uppercase">
                            <span class="bg-metallic-chrome bg-clip-text text-transparent pr-4">Teste de
                                conexão</span>
                        </h1>
                        <p class="mt-4 opacity-100 max-w-2xl mx-auto">Realize seu teste de conexão</p>
                        <div class="bg-brand-light" style="text-align:right;">
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div>
                            <div style="width:100%;height:0;padding-bottom:50%;position:relative;">
                                <iframe
                                    style="border:none;position:absolute;top:0;left:0;width:100%;height:100%;min-height:360px;border:none;overflow:hidden !important;"
                                    src="https://fast.com"></iframe>
                            </div>
                        </div>
                    </div>




            </main>

            <footer id="footer-placeholder" class="py-16 bg-brand-dark text-gray-400 border-t border-white/10"></footer>
        </div>
    </div>
</body>

</html>
