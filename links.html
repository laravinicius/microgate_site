<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111318">
    <meta name="description" content="Acesse os canais oficiais da Microgate IT Solutions.">
    <link rel="canonical" href="https://microgateinformatica.com.br/links">
    <link rel="icon" href="./img/ico.ico" type="image/x-icon">
    <title>Microgate IT Solutions | Links</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: transparent;
            color: #f5f7fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 22px 14px;
            place-items: center;
            background: url('./img/background.webp') center / cover no-repeat fixed;
        }

        .page {
            position: relative;
            display: flex;
            flex-direction: column;
            width: min(100%, 430px);
            min-height: min(760px, calc(100vh - 44px));
            margin: auto;
            padding: 58px 22px 20px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 30px;
            background: linear-gradient(155deg, rgba(40, 40, 40, .94), rgba(31, 31, 31, .94) 58%, rgba(24, 24, 24, .94));
            box-shadow: 0 28px 80px rgba(0, 0, 0, .48), inset 0 1px rgba(255, 255, 255, .04);
        }

        .page::before {
            position: absolute;
            z-index: 0;
            top: -125px;
            left: 50%;
            width: 320px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .07);
            content: "";
            filter: blur(55px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .page > * { position: relative; z-index: 1; }

        .share {
            position: absolute;
            top: 16px;
            right: 16px;
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 14px;
            background: rgba(255, 255, 255, .055);
            color: #e8eef9;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }

        .share:hover { transform: translateY(-1px); border-color: rgba(147, 197, 253, .48); background: rgba(255, 255, 255, .11); }
        .share:focus-visible, .link:focus-visible, .share-action:focus-visible, .share-close:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
        .share svg { width: 19px; height: 19px; }

        .share-dialog {
            width: min(100% - 28px, 500px);
            max-width: 500px;
            max-height: min(90vh, 760px);
            padding: 0;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 22px;
            background: #fff;
            color: #17191d;
            box-shadow: 0 28px 90px rgba(0, 0, 0, .55);
        }

        .share-dialog::backdrop { background: rgba(0, 0, 0, .76); backdrop-filter: blur(5px); }
        .share-dialog[open] { animation: dialog-in .18s ease-out; }
        @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .share-dialog-header { position: relative; display: flex; min-height: 58px; align-items: center; justify-content: center; padding: 12px 56px; border-bottom: 1px solid #e5e7eb; }
        .share-dialog-header h2 { margin: 0; font-size: 1rem; font-weight: 600; text-align: center; }
        .share-close { position: absolute; top: 9px; right: 12px; display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 10px; background: transparent; color: #40444c; cursor: pointer; }
        .share-close:hover { background: #f1f2f4; }
        .share-close svg { width: 19px; height: 19px; }
        .share-dialog-content { padding: 22px 24px 24px; }
        .share-preview { display: grid; min-height: 240px; align-content: center; justify-items: center; gap: 14px; padding: 26px; border-radius: 20px; background: linear-gradient(145deg, #292929, #1f1f1f 65%, #181818); color: #f5f7fb; text-align: center; }
        .share-preview img { display: block; width: min(100%, 250px); height: auto; }
        .share-preview-name { margin: 0; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
        .share-preview-handle { margin: -9px 0 0; color: #c3cede; font-size: .92rem; }
        .share-actions { display: flex; justify-content: center; gap: clamp(12px, 5vw, 28px); margin: 24px -8px 2px; }
        .share-action { display: grid; min-width: 72px; justify-items: center; gap: 7px; padding: 4px; border: 0; border-radius: 12px; background: transparent; color: #24272d; font: inherit; font-size: .76rem; text-align: center; text-decoration: none; cursor: pointer; }
        .share-action:hover { background: #f3f4f6; }
        .share-action-icon { display: grid; width: 52px; height: 52px; place-items: center; border-radius: 50%; background: #e9ecef; color: #30343b; }
        .share-action-icon svg { width: 23px; height: 23px; }
        .share-action--whatsapp .share-action-icon { background: #20c76a; color: #fff; }
        .share-action--whatsapp .share-action-icon img { width: 26px; height: 26px; object-fit: contain; filter: brightness(0) invert(1); }
        .share-action--facebook .share-action-icon { background: #1877f2; color: #fff; }
        .share-feedback { min-height: 20px; margin: 15px 0 0; color: #285c3e; font-size: .85rem; text-align: center; }

        .profile { padding: 22px 4px 30px; text-align: center; }

        .logo {
            display: block;
            width: min(100%, 286px);
            height: auto;
            margin: 0 auto 23px;
            object-fit: contain;
        }

        h1 { margin: 0; font-size: 1.22rem; font-weight: 700; letter-spacing: .015em; }
        .description { max-width: 290px; margin: 9px auto 0; color: #aab6c8; font-size: .93rem; line-height: 1.55; }

        .links { display: grid; gap: 11px; }

        .link {
            position: relative;
            display: flex;
            min-height: 58px;
            align-items: center;
            justify-content: center;
            padding: 13px 16px;
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 16px;
            background: rgba(255, 255, 255, .045);
            color: #f3f6fb;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }

        .link:hover { transform: translateY(-1px); border-color: rgba(147, 197, 253, .45); background: rgba(37, 99, 235, .14); }
        .link > span:last-child { width: 100%; padding: 0 36px; }
        .link-icon { position: absolute; left: 16px; display: grid; width: 32px; height: 32px; place-items: center; border-radius: 10px; background: rgba(96, 165, 250, .12); color: #93c5fd; }
        .link-icon svg { width: 19px; height: 19px; }
        .link-whatsapp { border-color: rgba(74, 222, 128, .3); background: rgba(34, 197, 94, .1); }
        .link-whatsapp .link-icon { background: rgba(34, 197, 94, .15); color: #86efac; }
        .link-whatsapp .link-icon img { filter: brightness(0) invert(1); }
        .link-whatsapp:hover { border-color: rgba(74, 222, 128, .6); background: rgba(34, 197, 94, .17); }

        .page-footer {
            margin-top: auto;
            padding: 22px 4px 2px;
            color: #8993a3;
            font-size: .7rem;
            letter-spacing: .08em;
            text-align: center;
            text-transform: uppercase;
        }

        .page-footer p { margin: 0; }
        .page-footer a { display: inline-block; margin-top: 7px; color: #aab6c8; letter-spacing: 0; text-decoration: none; text-transform: none; }
        .page-footer a:hover { color: #fff; text-decoration: underline; }
        .page-footer a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; border-radius: 2px; }

        .feedback { min-height: 22px; margin: 13px 0 0; color: #c3cede; font-size: .84rem; text-align: center; }

        @media (max-width: 380px) {
            body { padding: 10px; }
            .page { min-height: calc(100vh - 20px); padding: 52px 17px 16px; border-radius: 25px; }
            .profile { padding: 20px 0 25px; }
            .logo { width: min(100%, 250px); margin-bottom: 20px; }
            .links { gap: 9px; }
            .link { min-height: 55px; }
            .share-dialog-content { padding: 18px 16px 20px; }
            .share-preview { min-height: 205px; padding: 22px 16px; }
            .share-preview img { width: min(100%, 220px); }
            .share-actions { gap: 8px; margin-right: -4px; margin-left: -4px; }
            .share-action { min-width: 68px; font-size: .72rem; }
            .share-action-icon { width: 48px; height: 48px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page">
        <button class="share" id="share-button" type="button" aria-label="Compartilhar esta página" title="Compartilhar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path>
            </svg>
        </button>

        <dialog class="share-dialog" id="share-dialog" aria-labelledby="share-dialog-title">
            <div class="share-dialog-header">
                <h2 id="share-dialog-title">Compartilhar Microgate</h2>
                <button class="share-close" id="share-close" type="button" aria-label="Fechar janela de compartilhamento">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="share-dialog-content">
                <div class="share-preview">
                    <img src="./img/microgate2.webp" alt="Microgate IT Solutions" width="1147" height="204">
                    <p class="share-preview-name">Microgate IT Solutions</p>
                    <p class="share-preview-handle">@microgateitsolutions</p>
                </div>
                <div class="share-actions" aria-label="Opções de compartilhamento">
                    <button class="share-action" id="copy-share-link" type="button">
                        <span class="share-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3A5 5 0 0 0 13 2.93l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3A5 5 0 0 0 11 21.07l1.71-1.71"/></svg></span>
                        <span>Copiar link</span>
                    </button>
                    <a class="share-action share-action--whatsapp" id="share-whatsapp" target="_blank" rel="noopener noreferrer">
                        <span class="share-action-icon" aria-hidden="true"><img src="./img/whatsapp.webp" width="28" height="28" alt=""></span>
                        <span>WhatsApp</span>
                    </a>
                    <a class="share-action share-action--facebook" id="share-facebook" target="_blank" rel="noopener noreferrer">
                        <span class="share-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8.2h2.76l.41-3.2H13.5V7.56c0-.93.26-1.57 1.6-1.57h1.7V3.13c-.3-.04-1.34-.13-2.55-.13-2.52 0-4.25 1.54-4.25 4.37V9.6H7.14v3.2H10V21h3.5Z"/></svg></span>
                        <span>Facebook</span>
                    </a>
                </div>
                <p class="share-feedback" id="share-feedback" role="status" aria-live="polite"></p>
            </div>
        </dialog>

        <section class="profile" aria-labelledby="profile-name">
            <img class="logo" src="./img/microgate2.webp" alt="Microgate IT Solutions" width="1147" height="204">
            <h1 id="profile-name">@microgateitsolutions</h1>
            <p class="description">Soluções técnológicas para sua empresa</p>
        </section>

        <nav class="links" aria-label="Links da Microgate">
            <a class="link link-whatsapp" href="https://wa.me/554199550984" target="_blank" rel="noopener noreferrer">
                <span class="link-icon" aria-hidden="true"><img src="./img/whatsapp.webp" width="28" height="28" alt=""></span>
                <span>Contato por WhatsApp</span>
            </a>
            <a class="link" href="https://microgateinformatica.com.br/portifolio" target="_blank" rel="noopener noreferrer">
                <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18m-11 0v2h4v-2"/></svg></span>
                <span>Portifólio</span>
            </a>
            <a class="link" href="https://microgateinformatica.com.br" target="_blank" rel="noopener noreferrer">
                <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
                <span>Site</span>
            </a>
            <a class="link" href="https://maps.app.goo.gl/WcMdwTsxC7rkwyB4A" target="_blank" rel="noopener noreferrer">
                <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
                <span>Endereço</span>
            </a>
            <a class="link" href="https://www.instagram.com/microgateitsolutions/" target="_blank" rel="noopener noreferrer">
                <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
                <span>Instagram</span>
            </a>
        </nav>

        <footer class="page-footer">
            <p>© 2026 Microgate IT Solutions</p>
            <a href="https://microgateinformatica.com.br">microgateinformatica.com.br</a>
        </footer>
    </main>

    <script>
        const shareButton = document.getElementById('share-button');
        const shareDialog = document.getElementById('share-dialog');
        const closeButton = document.getElementById('share-close');
        const copyButton = document.getElementById('copy-share-link');
        const feedback = document.getElementById('share-feedback');
        const pageUrl = 'https://microgateinformatica.com.br/links';
        const encodedUrl = encodeURIComponent(pageUrl);

        document.getElementById('share-whatsapp').href = `https://wa.me/?text=${encodeURIComponent(`Conheça a Microgate IT Solutions: ${pageUrl}`)}`;
        document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;

        shareButton.addEventListener('click', () => {
            feedback.textContent = '';
            shareDialog.showModal();
        });

        closeButton.addEventListener('click', () => shareDialog.close());

        shareDialog.addEventListener('click', event => {
            if (event.target === shareDialog) shareDialog.close();
        });

        async function copyPageLink() {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    try {
                        await navigator.clipboard.writeText(pageUrl);
                        feedback.textContent = 'Link copiado!';
                        return;
                    } catch {
                        // Tenta o método compatível com navegadores sem permissão de Clipboard API.
                    }
                }

                const temporaryInput = document.createElement('textarea');
                temporaryInput.value = pageUrl;
                temporaryInput.setAttribute('readonly', '');
                temporaryInput.style.position = 'fixed';
                temporaryInput.style.opacity = '0';
                document.body.appendChild(temporaryInput);
                temporaryInput.select();
                const copied = document.execCommand('copy');
                temporaryInput.remove();
                if (!copied) throw new Error('Não foi possível copiar o link.');
                feedback.textContent = 'Link copiado!';
            } catch {
                feedback.textContent = 'Não foi possível copiar o link neste navegador.';
            }
        }

        copyButton.addEventListener('click', copyPageLink);
    </script>
</body>
</html>
