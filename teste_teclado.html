<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Teclado ABNT2 — Microgate Informática</title>
<meta name="description" content="Teste de teclado ABNT2 online: pressione as teclas do seu teclado e valide se todas funcionam, gerando um relatório em PDF do resultado.">
<link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d0d0f;
  --bg2:#141418;
  --bg3:#1c1c22;
  --bg4:#242430;
  --border:#2a2a38;
  --border2:#3a3a4e;
  --text:#e8e8f0;
  --text2:#9090a8;
  --text3:#5a5a72;
  --accent:#4f8ef7;
  --accent2:#2a5cd4;
  --green:#22c55e;
  --green-dim:#15803d;
  --green-bg:rgba(34,197,94,0.10);
  --yellow:#eab308;
  --red:#ef4444;
  --U:clamp(32px, 3.6vw, 50px); /* 1 key unit */
  --G:clamp(3px, 0.35vw, 5px);  /* gap */
  --R:5px;  /* radius */
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  min-height:100vh;
  user-select:none;
  overflow-x:hidden;
}

/* ── HEADER ── */
header{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:13px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.logo{
  display:flex;
  align-items:center;
  flex-shrink:0;
}
.logo img{
  display:block;
  height:32px;
  width:auto;
}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:18px;font-size:13px;color:var(--text2)}
.stats strong{color:var(--text)}

.btn{
  border-radius:var(--R);
  padding:9px 16px;
  font-family:'Syne',sans-serif;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-ghost{
  background:transparent;
  color:var(--text2);
  border:1px solid var(--border2);
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{
  background:var(--accent);
  color:#fff;
  border:none;
}
.btn-primary:hover{background:#3a7ce6}

/* ── MAIN ── */
main{padding:20px 24px;max-width:1400px;margin:0 auto}

/* ── KEYBOARD WRAPPER ── */
.kb-wrap{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px 20px;
  margin-bottom:18px;
  overflow-x:hidden;
}
.kb-label{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text3);
  margin-bottom:14px;
}

/* ── KEYBOARD LAYOUT ── */
.kb-layout{
  display:flex;
  flex-wrap:nowrap;
  gap:14px;
  align-items:flex-start;
  width:100%;
  justify-content:flex-start;
}
.kb-main{display:flex;flex-direction:column;gap:var(--G);flex:0 0 auto}
.kb-right{
  display:flex;
  gap:10px;
  align-items:start;
  flex-shrink:0;
}
.kb-nav{display:flex;flex-direction:column;gap:var(--G)}
.kb-nav-stack{display:flex;flex-direction:column;gap:var(--G)}
.kb-numpad{display:flex;flex-direction:column;gap:var(--G)}

.kr{display:flex;gap:var(--G);align-items:flex-start;width:100%}
.kr-fn{margin-bottom:6px}

/* ── KEY ── */
.key{
  width:var(--U);
  height:var(--U);
  background:var(--bg3);
  border:1px solid var(--border);
  border-bottom:1px solid var(--border);
  border-radius:var(--R);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:var(--text2);
  cursor:default;
  transition:background .08s,border-color .08s,color .08s;
  padding:2px 3px;
  text-align:center;
  line-height:1.25;
  flex-shrink:0;
}
.key .s{font-size:9px;color:var(--text3);line-height:1.1}
.key .b{font-size:10.5px}
.key .l{font-size:10.5px;color:var(--text2)}

/* tall numpad keys (+ and Enter) */
.key-tall{
  height:calc(var(--U)*2 + var(--G));
}

/* dummy invisible spacer for arrow cluster */
.key-dummy{
  width:var(--U);
  height:var(--U);
  flex-shrink:0;
  visibility:hidden;
}

/* Key width helpers — all in multiples of U + gaps */
.w1   {width:var(--U)}
.w125 {width:calc(var(--U)*1.25 + var(--G)*.25)}
.w15  {width:calc(var(--U)*1.5  + var(--G)*.5)}
.w175 {width:calc(var(--U)*1.75 + var(--G)*.75)}
.w2   {width:calc(var(--U)*2    + var(--G)*1)}
.w225 {width:calc(var(--U)*2.25 + var(--G)*1.25)}
.w25  {width:calc(var(--U)*2.5  + var(--G)*1.5)}
.w275 {width:calc(var(--U)*2.75 + var(--G)*1.75)}
.w3   {width:calc(var(--U)*3    + var(--G)*2)}
.w35  {width:calc(var(--U)*3.5  + var(--G)*2.5)}
.w4   {width:calc(var(--U)*4    + var(--G)*3)}
.w45  {width:calc(var(--U)*4.5  + var(--G)*3.5)}
.w575 {width:calc(var(--U)*5.75 + var(--G)*4.75)}
.w2num{width:calc(var(--U)*2    + var(--G))}  /* numpad 0 */
.w-enter{
  width:calc(var(--U)*2 + var(--G));
  height:calc(var(--U)*2 + var(--G));
}

/* States */
.key.lit{
  background:var(--green-bg);
  border-color:var(--green);
  color:var(--green);
  border-bottom-color:var(--green-dim);
}
.key.lit .s{color:var(--green);opacity:.7}
.key.lit .l{color:var(--green)}

.key.now{
  background:rgba(79,142,247,.18);
  border-color:var(--accent);
  color:var(--accent);
  border-bottom-color:var(--accent2);
  transform:translateY(1px);
}

/* ── INFO PANEL ── */
.info-grid{
  display:grid;
  grid-template-columns:200px 1fr 1fr;
  gap:14px;
}
.info-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
}
.info-card h3{
  font-family:'Syne',sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--text3);
  margin-bottom:8px;
}
.last-key{
  font-family:'Syne',sans-serif;
  font-size:28px;
  font-weight:800;
  color:var(--accent);
  min-height:32px;
}
.last-code{font-size:11px;color:var(--text3);margin-top:3px}

.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}
.prog-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .3s;width:0}

.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-g{background:var(--green)}
.dot-y{background:var(--yellow)}

.pending-list{font-size:11px;color:var(--yellow);line-height:1.9;max-height:72px;overflow-y:auto;word-break:break-all}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
  padding:9px 15px;font-size:13px;color:var(--text);
  opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;z-index:999;
}
.toast.show{opacity:1;transform:translateY(0)}

@media (max-width: 1360px){
  :root{
    --U:clamp(28px, 3vw, 46px);
    --G:clamp(2px, 0.28vw, 4px);
  }
  main{padding:18px 18px}
  .kb-wrap{padding:16px 16px 18px}
}

@media (max-width: 1120px){
  :root{
    --U:clamp(24px, 3.1vw, 38px);
    --G:clamp(2px, 0.24vw, 3px);
  }
  header{padding:12px 16px}
  main{padding:14px 14px}
  .kb-wrap{padding:14px 14px 16px}
}
</style>
</head>
<body>

<header>
  <div class="logo"><a href="https://microgateinformatica.com.br" rel="noopener noreferrer"><img src="./img/microgate2.webp" alt="Microgate"></a></div>
  <div class="header-right">
    <div class="stats">
      <span>Testadas: <strong id="s-tested">0</strong></span>
      <span>Total: <strong id="s-total">0</strong></span>
      <span>Cobertura: <strong id="s-pct">0%</strong></span>
    </div>
    <button class="btn btn-ghost" onclick="resetAll()">↺ Reiniciar</button>
    <button class="btn btn-primary" onclick="emitirRelatorio()">📄 Emitir Relatório</button>
  </div>
</header>

<main>
  <div class="kb-wrap" id="kb-wrap">
    <div class="kb-label">▸ Layout ABNT2 — Windows</div>
    <div class="kb-layout" id="kb"></div>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <h3>Última tecla</h3>
      <div class="last-key" id="last-lbl">—</div>
      <div class="last-code" id="last-code">Aguardando entrada...</div>
    </div>
    <div class="info-card">
      <h3>Progresso</h3>
      <div class="prog-row"><span><span class="dot dot-g"></span>Testadas</span><span id="p-frac">0 / 0</span></div>
      <div class="prog-bar"><div class="prog-fill" id="p-fill"></div></div>
      <div class="prog-row"><span><span class="dot dot-y"></span>Pendentes</span><span id="p-rem">0</span></div>
    </div>
    <div class="info-card">
      <h3>Teclas pendentes</h3>
      <div class="pending-list" id="pend-list">—</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const LOGO_SRC = './img/microgate2.webp'
let LOGO_PNG_DATA_URL = ''
const headerLogo = document.querySelector('header .logo img')
if (headerLogo) headerLogo.src = LOGO_SRC

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.onload = () => resolve(img)
    img.onerror = reject
    img.src = src
  })
}

const logoAssetReady = (async () => {
  try {
    const img = await loadImage(LOGO_SRC)
    const canvas = document.createElement('canvas')
    canvas.width = img.naturalWidth || img.width || 1
    canvas.height = img.naturalHeight || img.height || 1
    const ctx = canvas.getContext('2d')
    ctx.drawImage(img, 0, 0)
    LOGO_PNG_DATA_URL = canvas.toDataURL('image/png')
  } catch {
    LOGO_PNG_DATA_URL = ''
  }
})()

// ─────────────────────────────────────────
//  DATA — ABNT2 layout definition
// ─────────────────────────────────────────

// Helper: key(code, label, widthClass)  or  key(code, top, bot, widthClass)
const K  = (code,lbl,w='')          => ({code,lbl,w})
const K2 = (code,top,bot,w='')     => ({code,top,bot,w})
const SP = (w='')                    => ({code:'',dummy:true,w})

// Function row
const ROW_FN = [
  K('Escape','Esc','w15'),
  K('F1','F1'), K('F2','F2'), K('F3','F3'), K('F4','F4'),
  K('F5','F5'), K('F6','F6'), K('F7','F7'), K('F8','F8'),
  K('F9','F9'), K('F10','F10'), K('F11','F11'), K('F12','F12'),
]

// Number row
const ROW_NUM = [
  K2('Backquote',"'",'"'),
  K2('Digit1','!','1'), K2('Digit2','@','2'), K2('Digit3','#','3'),
  K2('Digit4','$','4'), K2('Digit5','%','5'), K2('Digit6','¨','6'),
  K2('Digit7','&','7'), K2('Digit8','*','8'), K2('Digit9','(','9'),
  K2('Digit0',')','0'), K2('Minus','_','-'), K2('Equal','+','='),
  K('Backspace','Backspace','w225'),
]

// QWERTY row — no Enter here; Enter goes between QWERTY+ASDF as tall key
const ROW_QWERTY = [
  K('Tab','Tab','w175'),
  K('KeyQ','Q'),K('KeyW','W'),K('KeyE','E'),K('KeyR','R'),K('KeyT','T'),
  K('KeyY','Y'),K('KeyU','U'),K('KeyI','I'),K('KeyO','O'),K('KeyP','P'),
  K2('BracketLeft','`','´'),
  K2('BracketRight','{','['),
]

// ASDF row
const ROW_ASDF = [
  K('CapsLock','Caps Lock','w2'),
  K('KeyA','A'),K('KeyS','S'),K('KeyD','D'),K('KeyF','F'),K('KeyG','G'),
  K('KeyH','H'),K('KeyJ','J'),K('KeyK','K'),K('KeyL','L'),
  K2('Semicolon','Ç','ç'),
  K2('Quote','^','~'),
  K2('Backslash','|','\\'),
]

// ZXCV row
const ROW_ZXCV = [
  K('ShiftLeft','Shift','w275'),
  K2('IntlBackslash','|','\\'),
  K('KeyZ','Z'),K('KeyX','X'),K('KeyC','C'),K('KeyV','V'),
  K('KeyB','B'),K('KeyN','N'),K('KeyM','M'),
  K2('Comma','<',','), K2('Period','>','.'), K2('Slash','?',';'),
  K('ShiftRight','Shift','w275'),
]

// Space row
const ROW_SPC = [
  K('ControlLeft','Ctrl','w15'),
  K('MetaLeft','Win','w15'),
  K('AltLeft','Alt','w15'),
  K('Space','','w575'),
  K('AltRight','AltGr','w175'),
  K('MetaRight','Win','w15'),
  K('ContextMenu','☰','w15'),
  K('ControlRight','Ctrl','w15'),
]

// Navigation cluster (3 rows of 3)
const NAV_ROWS = [
  [K('PrintScreen','Print'),  K('ScrollLock','Scroll'), K('Pause','Pause')],
  [K('Insert','Ins'),         K('Home','Home'),          K('PageUp','PgUp')],
  [K('Delete','Del'),         K('End','End'),            K('PageDown','PgDn')],
]

// Arrow cluster
const ARROW_ROWS = [
  [SP(),              K('ArrowUp','↑'),    SP()],
  [K('ArrowLeft','←'),K('ArrowDown','↓'), K('ArrowRight','→')],
]

// Numpad — tall keys handled separately via grid layout
const NP_ROW0 = [K('NumLock','Num'), K('NumpadDivide','/'), K('NumpadMultiply','*'), K('NumpadSubtract','−')]
const NP_ROW1 = [K('Numpad7','7'),   K('Numpad8','8'),      K('Numpad9','9')]         // + is tall, added via column
const NP_ROW2 = [K('Numpad4','4'),   K('Numpad5','5'),      K('Numpad6','6')]
const NP_ROW3 = [K('Numpad1','1'),   K('Numpad2','2'),      K('Numpad3','3')]          // Enter is tall, added via column
const NP_ROW4 = [K('Numpad0','0','w2num'), K('NumpadDecimal','.')]
const NP_ADD  = K('NumpadAdd','+')
const NP_ENT  = K('NumpadEnter','Enter')

// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
const pressedSet = new Set()
const codeEl     = {}
const allCodes   = new Set()

function collectCodes(){
  const all = [
    ...ROW_FN, ...ROW_NUM, ...ROW_QWERTY, ...ROW_ASDF,
    ...ROW_ZXCV, ...ROW_SPC,
    ...NAV_ROWS.flat(), ...ARROW_ROWS.flat(),
    ...NP_ROW0,...NP_ROW1,...NP_ROW2,...NP_ROW3,...NP_ROW4,
    NP_ADD, NP_ENT,
    {code:'Enter'}
  ]
  all.forEach(k=>{ if(k.code) allCodes.add(k.code) })
}

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────
function mkKey(k){
  if(k.dummy){
    const d=document.createElement('div')
    d.className='key-dummy'+(k.w?' '+k.w:'')
    return d
  }
  const el=document.createElement('div')
  el.className='key'+(k.w?' '+k.w:'')
  if(k.top!==undefined){
    el.innerHTML=`<span class="s">${k.top}</span><span class="b">${k.bot}</span>`
  } else {
    el.innerHTML=`<span class="l">${k.lbl??''}</span>`
  }
  if(k.code){
    codeEl[k.code]=el
    el.title=k.code
  }
  return el
}

function mkRow(keys, extraClass=''){
  const row=document.createElement('div')
  row.className='kr'+(extraClass?' '+extraClass:'')
  keys.forEach(k=>row.appendChild(mkKey(k)))
  return row
}

function buildKeyboard(){
  const kb=document.getElementById('kb')

  /* ── MAIN BLOCK ── */
  const main=document.createElement('div')
  main.className='kb-main'

  // Fn row
  main.appendChild(mkRow(ROW_FN,'kr-fn'))
  // Numbers
  main.appendChild(mkRow(ROW_NUM))

  // QWERTY + ASDF side-by-side with tall Enter on the right
  const enterWrap=document.createElement('div')
  enterWrap.style.cssText='display:flex;gap:var(--G);align-items:flex-start'

  const leftCol=document.createElement('div')
  leftCol.style.cssText='display:flex;flex-direction:column;gap:var(--G)'
  leftCol.appendChild(mkRow(ROW_QWERTY))
  leftCol.appendChild(mkRow(ROW_ASDF))
  enterWrap.appendChild(leftCol)

  const enterEl=document.createElement('div')
  enterEl.className='key w-enter'
  enterEl.innerHTML='<span class="l">Enter</span>'
  codeEl['Enter']=enterEl
  enterWrap.appendChild(enterEl)
  main.appendChild(enterWrap)

  // ZXCV
  main.appendChild(mkRow(ROW_ZXCV))
  // Space row
  main.appendChild(mkRow(ROW_SPC))

  /* ── RIGHT CLUSTER ── */
  const right=document.createElement('div')
  right.className='kb-right'

  const navStack=document.createElement('div')
  navStack.className='kb-nav-stack'

  // Nav 3×3
  const nav=document.createElement('div')
  nav.className='kb-nav'
  NAV_ROWS.forEach(r=>nav.appendChild(mkRow(r)))

  // Arrows
  const navArrow=document.createElement('div')
  navArrow.className='kb-nav'
  ARROW_ROWS.forEach(r=>navArrow.appendChild(mkRow(r)))
  navStack.appendChild(nav)
  navStack.appendChild(navArrow)

  // Numpad — 4 cols, tall keys in a column flex beside short keys
  // Layout:
  //   [Num][/][*][−]
  //   [7][8][9][+←tall]
  //   [4][5][6][+↕]
  //   [1][2][3][Ent←tall]
  //   [0 wide][.][ Ent↕]
  const np=document.createElement('div')
  np.className='kb-numpad'

  // Row 0
  np.appendChild(mkRow(NP_ROW0))

  // Rows 1+2 share tall +
  const addWrap=document.createElement('div')
  addWrap.style.cssText='display:flex;gap:var(--G);align-items:flex-start'
  const addLeft=document.createElement('div')
  addLeft.style.cssText='display:flex;flex-direction:column;gap:var(--G)'
  addLeft.appendChild(mkRow(NP_ROW1))
  addLeft.appendChild(mkRow(NP_ROW2))
  addWrap.appendChild(addLeft)
  const addEl=mkKey({...NP_ADD, w:''})
  addEl.classList.add('key-tall')
  codeEl['NumpadAdd']=addEl
  addWrap.appendChild(addEl)
  np.appendChild(addWrap)

  // Rows 3+4 share tall Enter
  const entWrap=document.createElement('div')
  entWrap.style.cssText='display:flex;gap:var(--G);align-items:flex-start'
  const entLeft=document.createElement('div')
  entLeft.style.cssText='display:flex;flex-direction:column;gap:var(--G)'
  entLeft.appendChild(mkRow(NP_ROW3))
  entLeft.appendChild(mkRow(NP_ROW4))
  entWrap.appendChild(entLeft)
  const entEl=mkKey({...NP_ENT, w:''})
  entEl.classList.add('key-tall')
  codeEl['NumpadEnter']=entEl
  entWrap.appendChild(entEl)
  np.appendChild(entWrap)

  right.appendChild(navStack)
  right.appendChild(np)

  kb.appendChild(main)
  kb.appendChild(right)
}

window.addEventListener('load',()=>{
  const wrap=document.getElementById('kb-wrap')
  if(wrap) wrap.scrollLeft=0
})

// ─────────────────────────────────────────
//  EVENTS
// ─────────────────────────────────────────
const LABEL={
  'Escape':'Esc','F1':'F1','F2':'F2','F3':'F3','F4':'F4','F5':'F5','F6':'F6',
  'F7':'F7','F8':'F8','F9':'F9','F10':'F10','F11':'F11','F12':'F12',
  'Backquote':'" / \'','Digit1':'1','Digit2':'2','Digit3':'3','Digit4':'4',
  'Digit5':'5','Digit6':'6','Digit7':'7','Digit8':'8','Digit9':'9','Digit0':'0',
  'Minus':'-','Equal':'=','Backspace':'Backspace','Tab':'Tab',
  'KeyQ':'Q','KeyW':'W','KeyE':'E','KeyR':'R','KeyT':'T','KeyY':'Y','KeyU':'U',
  'KeyI':'I','KeyO':'O','KeyP':'P','BracketLeft':'´','BracketRight':'[',
  'CapsLock':'Caps Lock','KeyA':'A','KeyS':'S','KeyD':'D','KeyF':'F','KeyG':'G',
  'KeyH':'H','KeyJ':'J','KeyK':'K','KeyL':'L','Semicolon':'Ç','Quote':'~',
  'Backslash':'\\','Enter':'Enter','ShiftLeft':'Shift Esq','IntlBackslash':'\\',
  'KeyZ':'Z','KeyX':'X','KeyC':'C','KeyV':'V','KeyB':'B','KeyN':'N','KeyM':'M',
  'Comma':',','Period':'.','Slash':';','ShiftRight':'Shift Dir',
  'ControlLeft':'Ctrl Esq','MetaLeft':'Win Esq','AltLeft':'Alt','Space':'Espaço',
  'AltRight':'AltGr','MetaRight':'Win Dir','ContextMenu':'Menu','ControlRight':'Ctrl Dir',
  'PrintScreen':'Print Screen','ScrollLock':'Scroll Lock','Pause':'Pause/Break',
  'Insert':'Insert','Home':'Home','PageUp':'Page Up',
  'Delete':'Delete','End':'End','PageDown':'Page Down',
  'ArrowUp':'↑ Cima','ArrowLeft':'← Esq','ArrowDown':'↓ Baixo','ArrowRight':'→ Dir',
  'NumLock':'Num Lock','NumpadDivide':'Num /','NumpadMultiply':'Num *',
  'NumpadSubtract':'Num −','Numpad7':'Num 7','Numpad8':'Num 8','Numpad9':'Num 9',
  'NumpadAdd':'Num +','Numpad4':'Num 4','Numpad5':'Num 5','Numpad6':'Num 6',
  'Numpad1':'Num 1','Numpad2':'Num 2','Numpad3':'Num 3','NumpadEnter':'Num Enter',
  'Numpad0':'Num 0','NumpadDecimal':'Num .',
}

function updateStats(){
  const total=allCodes.size, tested=pressedSet.size
  const pct=total?Math.round(tested/total*100):0
  document.getElementById('s-tested').textContent=tested
  document.getElementById('s-total').textContent=total
  document.getElementById('s-pct').textContent=pct+'%'
  document.getElementById('p-frac').textContent=tested+' / '+total
  document.getElementById('p-rem').textContent=(total-tested)
  document.getElementById('p-fill').style.width=pct+'%'
  const pend=[...allCodes].filter(c=>!pressedSet.has(c))
  const pl=document.getElementById('pend-list')
  if(!pend.length){pl.textContent='✓ Todas as teclas testadas!';pl.style.color='var(--green)'}
  else{pl.style.color='var(--yellow)';pl.textContent=pend.map(c=>LABEL[c]||c).join('  ·  ')}
}

document.addEventListener('keydown',e=>{
  e.preventDefault();e.stopPropagation()
  const c=e.code; if(!c) return
  if(codeEl[c]){codeEl[c].classList.remove('lit');codeEl[c].classList.add('now')}
  if(allCodes.has(c)) pressedSet.add(c)
  document.getElementById('last-lbl').textContent=LABEL[c]||c
  document.getElementById('last-code').textContent=`code: ${c}  |  key: "${e.key}"`
  updateStats()
},true)

document.addEventListener('keyup',e=>{
  e.preventDefault();e.stopPropagation()
  const c=e.code; if(!c) return
  if(codeEl[c]){codeEl[c].classList.remove('now');if(pressedSet.has(c))codeEl[c].classList.add('lit')}
},true)

window.addEventListener('keydown',e=>e.preventDefault(),true)
window.addEventListener('keyup',e=>e.preventDefault(),true)
window.addEventListener('contextmenu',e=>e.preventDefault())

function resetAll(){
  pressedSet.clear()
  Object.values(codeEl).forEach(el=>el.classList.remove('lit','now'))
  document.getElementById('last-lbl').textContent='—'
  document.getElementById('last-code').textContent='Aguardando entrada...'
  updateStats()
  toast('↺ Teste reiniciado')
}

function toast(msg){
  const t=document.getElementById('toast')
  t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),2500)
}

// ─────────────────────────────────────────
//  PDF REPORT — Landscape A4
// ─────────────────────────────────────────
async function emitirRelatorio(){
  await logoAssetReady
  const {jsPDF}=window.jspdf
  // Landscape: W=297, H=210
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'})
  const W=297, H=210
  const now=new Date()

  function newPage(){
    doc.addPage([297,210],'landscape')
    doc.setFillColor(13,13,15)
    doc.rect(0,0,W,H,'F')
  }

  function bgFill(){
    doc.setFillColor(13,13,15)
    doc.rect(0,0,W,H,'F')
  }

  function header(pg,total){
    doc.setFillColor(20,20,24)
    doc.rect(0,0,W,22,'F')
    doc.setDrawColor(42,42,56);doc.setLineWidth(0.25)
    doc.line(0,22,W,22)
    if(LOGO_PNG_DATA_URL){
      const logoProps=doc.getImageProperties(LOGO_PNG_DATA_URL)
      const logoH=13.6
      const logoW=logoH*(logoProps.width/logoProps.height)
      doc.addImage(LOGO_PNG_DATA_URL,'PNG',12,4.8,logoW,logoH)
    } else {
      doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(79,142,247)
      doc.text('MICROGATE',12,12)
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(144,144,168)
      doc.text('Informática',12,18)
    }
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(144,144,168)
    doc.text('Diagnóstico de Teclado ABNT2 — Windows',W-12,10,{align:'right'})
    doc.setFontSize(7);doc.setTextColor(90,90,114)
    doc.text(now.toLocaleString('pt-BR'),W-12,16,{align:'right'})
    doc.text(`Pág. ${pg}/${total}`,W-12,20,{align:'right'})
  }

  function footer(){
    doc.setFillColor(20,20,24)
    doc.rect(0,H-10,W,10,'F')
    doc.setDrawColor(42,42,56);doc.setLineWidth(0.25)
    doc.line(0,H-10,W,H-10)
    doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(90,90,114)
    doc.text('Microgate Informática — Relatório de Diagnóstico de Teclado ABNT2',12,H-4)
  }

  const total=allCodes.size, tested=pressedSet.size
  const pct=total?Math.round(tested/total*100):0, pending=total-tested

  /* ── PAGE 1 ── */
  bgFill()

  // Summary cards
  const cards=[
    {lbl:'TECLAS TESTADAS',val:tested,   col:[34,197,94]},
    {lbl:'TOTAL DE TECLAS', val:total,    col:[79,142,247]},
    {lbl:'PENDENTES',        val:pending,  col:[234,179,8]},
    {lbl:'COBERTURA',        val:pct+'%', col:pct===100?[34,197,94]:pct>=80?[234,179,8]:[239,68,68]},
  ]
  const cw=54,ch=26,cx0=12,cy0=27,cgap=6
  cards.forEach((c,i)=>{
    const cx=cx0+i*(cw+cgap)
    doc.setFillColor(26,26,32);doc.roundedRect(cx,cy0,cw,ch,3,3,'F')
    doc.setDrawColor(...c.col);doc.setLineWidth(0.4);doc.roundedRect(cx,cy0,cw,ch,3,3,'S')
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...c.col)
    doc.text(String(c.val),cx+cw/2,cy0+14,{align:'center'})
    doc.setFont('helvetica','normal');doc.setFontSize(5.5);doc.setTextColor(90,90,114)
    doc.text(c.lbl,cx+cw/2,cy0+22,{align:'center'})
  })

  // Progress bar
  const pbX=12, pbW=W-24, pbY=59, pbH=4
  doc.setFillColor(26,26,32);doc.roundedRect(pbX,pbY,pbW,pbH,2,2,'F')
  if(pct>0){doc.setFillColor(34,197,94);doc.roundedRect(pbX,pbY,pbW*pct/100,pbH,2,2,'F')}
  doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(90,90,114)
  doc.text('Progresso geral',pbX,pbY-2)
  doc.text(pct+'%',pbX+pbW,pbY-2,{align:'right'})

  // ── KEYBOARD VISUAL REPLICA ──
  // Draws a miniature keyboard mirroring the actual layout, color-coded
  const KY=68   // keyboard starts Y
  const U=10    // 1u in mm
  const G=1.2   // gap in mm
  const R=1.2   // radius

  function kFill(ok){
    if(ok){doc.setFillColor(18,50,30);doc.setDrawColor(34,197,94)}
    else  {doc.setFillColor(22,22,28);doc.setDrawColor(58,58,78)}
    doc.setLineWidth(0.25)
  }
  function kLabel(txt,cx,cy,uw,uh,ok){
    const s=txt.length>5?txt.slice(0,4)+'…':txt
    doc.setFont('helvetica',ok?'bold':'normal')
    doc.setFontSize(4.5)
    doc.setTextColor(ok?34:80,ok?197:80,ok?94:100)
    doc.text(s,cx+uw/2,cy+uh/2+0.8,{align:'center'})
  }
  function drawKey(code,x,y,uw,uh){
    const ok=pressedSet.has(code)
    kFill(ok)
    doc.roundedRect(x,y,uw,uh,R,R,'FD')
    if(code) kLabel(LABEL[code]||code,x,y,uw,uh,ok)
    return uw+G
  }
  function u(n){return n*U+(n-1)*G}  // width for n units
  function drawCells(items,x,y){
    let cx=x
    items.forEach(item=>{
      const [code,w=U,h=U]=item
      drawKey(code,cx,y,w,h)
      cx+=w+G
    })
  }

  const leftX=12
  const navX=192
  const npX=240
  const topY=KY
  const rowGap=G
  const tallH=U*2+G
  const row0Y=topY
  const row1Y=topY+U+rowGap
  const row2Y=row1Y+U+rowGap
  const row3Y=row2Y+U+rowGap
  const row4Y=row3Y+U+rowGap
  const row5Y=row4Y+U+rowGap

  // ── Fn row ──
  drawCells([
    ['Escape',u(1.5)],
    ['F1'],['F2'],['F3'],['F4'],
    ['F5'],['F6'],['F7'],['F8'],
    ['F9'],['F10'],['F11'],['F12'],
  ],leftX,row0Y)

  // gap between Fn and nav cluster
  drawCells([['PrintScreen'],['ScrollLock'],['Pause']],navX,row0Y)

  // number row
  drawCells([
    ['Backquote'],['Digit1'],['Digit2'],['Digit3'],['Digit4'],['Digit5'],['Digit6'],
    ['Digit7'],['Digit8'],['Digit9'],['Digit0'],['Minus'],['Equal'],
  ],leftX,row1Y)
  drawKey('Backspace',leftX+u(13)+G*13,row1Y,u(2.25),U)

  // right cluster row 1
  drawCells([['Insert'],['Home'],['PageUp']],navX,row1Y)
  drawCells([['NumLock'],['NumpadDivide'],['NumpadMultiply'],['NumpadSubtract']],npX,row1Y)

  // ── QWERTY row ──
  let kx=leftX
  drawKey('Tab',kx,row2Y,u(1.75),U); kx+=u(1.75)+G
  ;['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP',
    'BracketLeft','BracketRight'].forEach(c=>{drawKey(c,kx,row2Y,U,U);kx+=U+G})
  const enterXpos=kx
  drawKey('Enter',enterXpos,row2Y,u(2),tallH)

  // right cluster row 2
  drawCells([['Delete'],['End'],['PageDown']],navX,row2Y)
  drawCells([['Numpad7'],['Numpad8'],['Numpad9']],npX,row2Y)
  drawKey('NumpadAdd',npX+u(3)+G,row1Y,U,tallH)

  // ── ASDF row ──
  kx=leftX
  drawKey('CapsLock',kx,row3Y,u(2),U); kx+=u(2)+G
  ;['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL',
    'Semicolon','Quote','Backslash'].forEach(c=>{drawKey(c,kx,row3Y,U,U);kx+=U+G})
  drawKey('ArrowUp',navX+U+G,row3Y,U,U)
  drawCells([['Numpad4'],['Numpad5'],['Numpad6']],npX,row3Y)

  // ── ZXCV row ──
  kx=leftX
  drawKey('ShiftLeft',kx,row4Y,u(2.75),U); kx+=u(2.75)+G
  ;['IntlBackslash','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM',
    'Comma','Period','Slash'].forEach(c=>{drawKey(c,kx,row4Y,U,U);kx+=U+G})
  drawKey('ShiftRight',kx,row4Y,u(2.75),U); kx+=u(2.75)+G

  // arrows Left Down Right
  drawKey('ArrowLeft',navX,row4Y,U,U)
  drawKey('ArrowDown',navX+U+G,row4Y,U,U)
  drawKey('ArrowRight',navX+2*(U+G),row4Y,U,U)

  // numpad 1 2 3 and tall Enter
  drawCells([['Numpad1'],['Numpad2'],['Numpad3']],npX,row4Y)
  drawKey('NumpadEnter',npX+u(3)+G,row3Y,U,tallH)

  // ── Space row ──
  kx=leftX
  ;[['ControlLeft',u(1.5)],['MetaLeft',u(1.5)],['AltLeft',u(1.5)]].forEach(([c,w])=>{
    drawKey(c,kx,row5Y,w,U);kx+=w+G
  })
  drawKey('Space',kx,row5Y,u(5.75),U); kx+=u(5.75)+G
  ;[['AltRight',u(1.75)],['MetaRight',u(1.5)],['ContextMenu',u(1.5)],['ControlRight',u(1.5)]].forEach(([c,w])=>{
    drawKey(c,kx,row5Y,w,U);kx+=w+G
  })

  // numpad 0 and .
  drawKey('Numpad0',npX,row5Y,u(2),U)
  drawKey('NumpadDecimal',npX+u(2)+G,row5Y,U,U)

  // ── LEGEND ──
  const lgY=H-18
  doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(90,90,114)
  doc.text('LEGENDA:',12,lgY)
  // OK swatch
  doc.setFillColor(18,50,30);doc.setDrawColor(34,197,94);doc.setLineWidth(0.3)
  doc.roundedRect(32,lgY-4,14,5,1,1,'FD')
  doc.setFont('helvetica','normal');doc.setFontSize(5.5);doc.setTextColor(34,197,94)
  doc.text('Testada (OK)',47,lgY)
  // Pending swatch
  doc.setFillColor(22,22,28);doc.setDrawColor(58,58,78)
  doc.roundedRect(88,lgY-4,14,5,1,1,'FD')
  doc.setTextColor(80,80,100)
  doc.text('Não testada',104,lgY)

  // ── PAGE 2 — Key status table ──
  newPage()
  bgFill()

  // Groups for table
  const groups=[
    {title:'Teclas de Função',
     codes:['Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12']},
    {title:'Linha Numérica',
     codes:['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace']},
    {title:'Linha QWERTY + Enter',
     codes:['Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Enter']},
    {title:'Linha ASDF',
     codes:['CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Backslash']},
    {title:'Linha ZXCV',
     codes:['ShiftLeft','IntlBackslash','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight']},
    {title:'Linha do Espaço',
     codes:['ControlLeft','MetaLeft','AltLeft','Space','AltRight','MetaRight','ContextMenu','ControlRight']},
    {title:'Navegação',
     codes:['PrintScreen','ScrollLock','Pause','Insert','Home','PageUp','Delete','End','PageDown','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']},
    {title:'Bloco Numérico',
     codes:['NumLock','NumpadDivide','NumpadMultiply','NumpadSubtract','Numpad7','Numpad8','Numpad9','NumpadAdd','Numpad4','Numpad5','Numpad6','Numpad1','Numpad2','Numpad3','NumpadEnter','Numpad0','NumpadDecimal']},
  ]

  let gy=26
  const cW=28, cH=9, gX=2, gY=2, mX=12, maxX=W-mX

  groups.forEach(grp=>{
    if(gy+14>H-14){newPage();bgFill();gy=26}
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(79,142,247)
    doc.text(grp.title.toUpperCase(),mX,gy)
    gy+=3.5
    doc.setDrawColor(42,42,56);doc.setLineWidth(0.2);doc.line(mX,gy,maxX,gy)
    gy+=3

    let cx=mX, cy=gy
    grp.codes.forEach(code=>{
      if(cx+cW>maxX){cx=mX;cy+=cH+gY}
      if(cy+cH>H-14){newPage();bgFill();cx=mX;cy=26}
      const ok=pressedSet.has(code)
      if(ok){doc.setFillColor(18,50,30);doc.setDrawColor(34,197,94)}
      else  {doc.setFillColor(22,22,28);doc.setDrawColor(58,58,78)}
      doc.setLineWidth(0.25);doc.roundedRect(cx,cy,cW,cH,1.5,1.5,'FD')
      const lbl=LABEL[code]||code
      const s=lbl.length>9?lbl.slice(0,8)+'…':lbl
      doc.setFont('helvetica',ok?'bold':'normal');doc.setFontSize(5.5)
      doc.setTextColor(ok?34:80,ok?197:80,ok?94:100)
      doc.text(s,cx+cW/2,cy+4,{align:'center'})
      doc.setFontSize(4.5);doc.setTextColor(ok?22:58,ok?160:58,ok?74:78)
      doc.text(ok?'✓ OK':'✗ pendente',cx+cW/2,cy+7.5,{align:'center'})
      cx+=cW+gX
    })
    gy=cy+cH+8
  })

  // ── Add headers + footers to all pages ──
  const pages=doc.getNumberOfPages()
  for(let p=1;p<=pages;p++){
    doc.setPage(p)
    header(p,pages)
    footer()
  }

  const fname=`diagnostico-teclado-${now.toISOString().slice(0,10)}.pdf`
  doc.save(fname)
  toast('✓ Relatório PDF gerado!')
}

collectCodes()
buildKeyboard()
updateStats()
</script>
