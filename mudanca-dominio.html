<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="10; url=https://microgateit.com.br/">
    <title>Novo endere&ccedil;o | Microgate IT Solutions</title>

    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: #090d12;
            color: #f4f7fa;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.65;
        }

        .redirect-shell {
            display: flex;
            width: min(100%, 1280px);
            min-height: 100vh;
            margin: 0 auto;
            flex-direction: column;
            background: linear-gradient(180deg, #0c1117, #0d1218);
            box-shadow: 0 24px 90px rgba(0, 0, 0, .48);
        }

        .redirect-header {
            display: flex;
            min-height: 100px;
            align-items: center;
            justify-content: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(203, 213, 225, .14);
            background: rgba(13, 18, 24, .94);
        }

        .redirect-logo {
            display: block;
            width: min(270px, 75vw);
            height: auto;
        }

        .redirect-main {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 64px 20px;
            background: radial-gradient(ellipse at 50% 30%, rgba(41, 93, 138, .14), transparent 60%);
        }

        .redirect-card {
            width: min(100%, 660px);
            padding: clamp(32px, 6vw, 60px);
            border: 1px solid rgba(203, 213, 225, .14);
            border-radius: 14px;
            background: #171e26;
            text-align: center;
        }

        .redirect-icon {
            display: inline-flex;
            width: 56px;
            height: 56px;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 1px solid rgba(114, 183, 242, .22);
            border-radius: 10px;
            background: rgba(114, 183, 242, .10);
            color: #9bcfff;
        }

        .redirect-icon svg { width: 27px; height: 27px; }

        .redirect-eyebrow {
            margin: 0 0 12px;
            color: #9bcfff;
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 18px;
            color: #f7f9fb;
            font-size: clamp(2.25rem, 5vw, 3.65rem);
            font-weight: 700;
            letter-spacing: -.055em;
            line-height: 1.08;
        }

        h1 span { color: #a9c9e4; }

        .redirect-description {
            max-width: 480px;
            margin: 0 auto;
            color: #c2cbd5;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .redirect-domain {
            margin: 26px 0;
            color: #fff;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: -.025em;
            overflow-wrap: anywhere;
        }

        .redirect-button {
            display: inline-flex;
            min-height: 50px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #d9edff;
            color: #111b25;
            font-weight: 700;
            line-height: 1.4;
            text-decoration: none;
            transition: background-color .2s ease, transform .2s ease;
        }

        .redirect-button:hover { background: #fff; }
        .redirect-button:focus-visible { outline: 3px solid #9bcfff; outline-offset: 4px; }
        .redirect-button svg { width: 18px; height: 18px; flex: 0 0 18px; }

        .redirect-timing {
            margin: 26px 0 0;
            color: #c2cbd5;
            font-size: .9rem;
        }

        .redirect-timing strong { color: #f4f7fa; font-variant-numeric: tabular-nums; }

        .redirect-progress {
            width: min(100%, 220px);
            height: 3px;
            margin: 14px auto 0;
            overflow: hidden;
            border-radius: 3px;
            background: rgba(203, 213, 225, .15);
        }

        .redirect-progress span {
            display: block;
            width: 100%;
            height: 100%;
            background: #72b7f2;
            transform-origin: left;
            animation: redirect-progress 10s linear forwards;
        }

        .redirect-footer {
            padding: 20px;
            border-top: 1px solid rgba(203, 213, 225, .1);
            color: #aebac7;
            font-size: .85rem;
            text-align: center;
        }

        @keyframes redirect-progress { to { transform: scaleX(0); } }

        @media (hover: hover) and (prefers-reduced-motion: no-preference) {
            .redirect-button:hover { transform: translateY(-2px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .redirect-button { transition: none; }
            .redirect-progress span { animation: none; }
        }

        @media (max-width: 480px) {
            .redirect-header { min-height: 84px; }
            .redirect-main { padding: 36px 16px; }
            .redirect-button { width: 100%; }
        }
    </style>
</head>

    <script>
        window.addEventListener('load', function () {
            var seconds = document.getElementById('redirect-seconds');
            var unit = document.getElementById('redirect-unit');
            var deadline = Date.now() + 10000;
            var interval = window.setInterval(function () {
                var remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
                seconds.textContent = remaining;
                unit.textContent = remaining === 1 ? 'segundo' : 'segundos';
                if (remaining === 0) window.clearInterval(interval);
            }, 250);
        });
    </script>
